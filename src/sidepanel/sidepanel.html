<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browsermarked</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="sp-header">
    <h1 class="sp-title">Browsermarked</h1>
    <span class="sp-count" id="totalCount">0</span>
  </header>

  <div class="sp-search">
    <input type="text" id="searchInput" placeholder="搜索标注、注释或标签...">
    <button id="clearSearch" class="sp-search-clear hidden" title="清除搜索">&times;</button>
  </div>

  <div class="sp-tags" id="tagFilters">
    <!-- 动态生成标签筛选按钮 -->
  </div>

  <div class="sp-controls">
    <select id="sortSelect" class="sp-sort">
      <option value="newest">最新优先</option>
      <option value="oldest">最早优先</option>
      <option value="domain">按域名分组</option>
    </select>
    <div class="sp-actions">
      <button id="exportBtn" class="sp-btn" title="导出所有标注">导出</button>
      <button id="importBtn" class="sp-btn" title="导入标注数据">导入</button>
      <input type="file" id="importFile" accept=".json" class="hidden">
    </div>
  </div>

  <main class="sp-content" id="content">
    <div class="sp-empty" id="emptyState">
      <div class="sp-empty-icon">+</div>
      <p>还没有任何标注</p>
      <p class="sp-empty-hint">选中网页文字即可高亮标注，或右键页面收藏</p>
    </div>
  </main>

  <div class="sp-toast hidden" id="toast"></div>

  <script src="../utils/storage.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
